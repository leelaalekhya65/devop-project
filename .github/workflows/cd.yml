name: CD

# On every merge to main: build and push the image to GHCR, then bump the image
# tag in helm/webapp/values.yaml. Argo CD sees that commit and syncs the cluster (GitOps).
on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devops-platform-webapp

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in Helm values
        run: |
          sed -i "s|^\(\s*repository:\).*|\1 ${IMAGE}|" helm/webapp/values.yaml
          sed -i "s|^\(\s*tag:\).*|\1 \"${{ steps.meta.outputs.tag }}\"|" helm/webapp/values.yaml

      - name: Commit the new tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/webapp/values.yaml
          git commit -m "chore(helm): deploy ${{ steps.meta.outputs.tag }} [skip ci]" || echo "nothing to commit"
          git push
