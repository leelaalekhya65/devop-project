name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - run: pytest app -q

  lint-iac:
    name: Lint Helm, Terraform, Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
      - name: Helm lint and template
        run: |
          helm lint helm/webapp
          helm template webapp helm/webapp > /dev/null

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Ansible lint
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install ansible.posix
          ansible-lint ansible/playbook.yml

  docker:
    name: Build image (no push on PRs)
    runs-on: ubuntu-latest
    needs: [test, lint-iac]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          tags: devops-platform/webapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
