---
# Targets come from .env (ANSIBLE_HOST / ANSIBLE_USER). Default is the local machine.
all:
  children:
    devops:
      hosts:
        target:
          ansible_host: "{{ lookup('env', 'ANSIBLE_HOST') | default('localhost', true) }}"
          ansible_user: "{{ lookup('env', 'ANSIBLE_USER') | default('ubuntu', true) }}"
          ansible_python_interpreter: /usr/bin/python3
