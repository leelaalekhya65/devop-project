# Argo CD "app of apps": apply this one file and Argo CD syncs everything under argocd/apps/.
# Replace REPO_URL with your GitHub repository URL before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: devops-platform
  source:
    repoURL: REPO_URL
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
